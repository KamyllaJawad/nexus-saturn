# Blueprint do Render: API e telas no mesmo serviço web (Docker).
# No Render: New > Blueprint > este repositório.
# A raiz redireciona para o Vue (/v2/); as telas antigas seguem em /index.html. O contexto do Docker é a raiz, porque o
# FastAPI procura 9-frontend ao lado de 8-backend e o v2 é gerado na imagem.
services:
  - type: web
    name: astrohealth-api
    runtime: docker
    dockerfilePath: ./8-backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/missao
    autoDeploy: true
    envVars:
      - key: COSMO_OLLAMA
        value: "0"
