<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Relógio · Elo com a família</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#04060c}
a{color:#00e5ff}a:hover{color:#7df3ff}
</style>
</helmet>
<div style="width: 400px; height: 400px; box-sizing: border-box; padding: 40px; background: #04060c; display: flex; align-items: flex-start; justify-content: center; font-family: Inter, system-ui, sans-serif; color: #eef2f8;">
<div class="dev" data-dev="watch-round">
<div class="bezel-round frame"><button class="crown" aria-label="Coroa: próxima tela do relógio"></button><div data-render="watch-round"><div class="ws round lv0  " style="--beat:0.82s"><div class="ws-in"><div class="w-tag water">Elo Terra · família</div>
      <div class="w-chal"><div class="w-chal-t"><span>Corrida Terra–órbita</span><b>43,6/60 km</b></div><div class="bar-t"><i style="width:72.7%"></i></div></div>
      <div class="w-fam">
        <div class="w-fm"><span class="av">AN</span><span class="tx">Ana bebeu 500 ml</span><b>+25%</b></div>
        <div class="w-fm"><span class="av">LU</span><span class="tx">Lucas correu 5 km</span><b>+15%</b></div>
      </div><button class="w-btn ghost sm2">Mandar incentivo ao Lucas</button><div class="w-dots"><button class="dot" data-arg="home" aria-label="Início" aria-current="false"><i></i></button><button class="dot" data-arg="insight" aria-label="Insight da Cosmo" aria-current="false"><i></i></button><button class="dot" data-arg="chat" aria-label="Chat com a Cosmo" aria-current="false"><i></i></button><button class="dot" data-arg="game" aria-label="Missões da estufa" aria-current="false"><i></i></button><button class="dot" data-arg="elo" aria-label="Elo com a família" aria-current="true"><i></i></button><button class="dot" data-arg="sync" aria-label="Sincronia com a Terra" aria-current="false"><i></i></button><button class="dot" data-arg="vitals" aria-label="Sinais" aria-current="false"><i></i></button></div></div></div></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
